<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Shield Hexagon -->
  <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" stroke="url(#cyberGlow)" stroke-width="3.5" fill="#0c121e" filter="url(#neonBlur)"/>
  
  <!-- Stylized QR matrix blocks inside -->
  <rect x="26" y="24" width="16" height="16" rx="3" stroke="#00ffcc" stroke-width="2.5" fill="none"/>
  <rect x="30.5" y="28.5" width="7" height="7" rx="1.5" fill="#00ffcc"/>

  <rect x="58" y="24" width="16" height="16" rx="3" stroke="#00ffcc" stroke-width="2.5" fill="none"/>
  <rect x="62.5" y="28.5" width="7" height="7" rx="1.5" fill="#00ffcc"/>

  <rect x="26" y="56" width="16" height="16" rx="3" stroke="#00ffcc" stroke-width="2.5" fill="none"/>
  <rect x="30.5" y="60.5" width="7" height="7" rx="1.5" fill="#00ffcc"/>

  <!-- Center Key / Wireless Signal Node -->
  <circle cx="66" cy="66" r="4" fill="#00e676"/>
  <path d="M50 42 L50 56 M44 50 L56 50" stroke="#00ffcc" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M58 58 L74 74" stroke="#0077ff" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 2"/>
</svg>
